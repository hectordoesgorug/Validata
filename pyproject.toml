[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "validata"
version = "0.1.0"
description = "Portable desktop file validation and sequence consistency utility"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["customtkinter>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
validata = "validata.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
